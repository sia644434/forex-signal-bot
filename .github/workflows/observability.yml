name: Production Observability

on:
  push:
    paths-ignore:
      - "observability/latest/**"
      - "observability/raw/**"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: production-observability
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect production telemetry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          RAILWAY_DEPLOYMENT_ID: ${{ vars.RAILWAY_DEPLOYMENT_ID }}
          RAILWAY_LOG_LINES: ${{ vars.RAILWAY_LOG_LINES }}
          RAILWAY_BUILD_LOG_LINES: ${{ vars.RAILWAY_BUILD_LOG_LINES }}
        run: PYTHONPATH=. python scripts/collect_observability.py
      - name: Upload observability snapshot and sanitized raw archive
        uses: actions/upload-artifact@v4
        with:
          name: observability-${{ github.run_id }}
          path: |
            observability/latest/
            observability/raw/
          if-no-files-found: ignore
          retention-days: 14
