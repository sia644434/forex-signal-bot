name: TASK-062 apply

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'siasoltoon'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply precise regression fix
        run: |
          python - <<'PY'
          from pathlib import Path

          engine = Path('analysis/confidence_engine.py')
          text = engine.read_text()
          old = '''            "supply_demand": self.normalize_signed_score(\n                self._get(\n                    analysis,\n                    "trend_score",\n                    0.0,\n                )\n            ),'''
          new = '''            "supply_demand": self.normalize_signed_score(\n                self._get(\n                    analysis,\n                    "supply_demand_score",\n                    0.0,\n                )\n            ),'''
          if old not in text:
              raise SystemExit('Expected supply-demand mapping not found')
          engine.write_text(text.replace(old, new, 1))

          test = Path('tests/test_confidence_score_contract.py')
          text = test.read_text()
          text = text.replace('assert scores["supply_demand"] == 40.0', 'assert scores["supply_demand"] == 50.0', 1)
          marker = '    assert scores["supply_demand"] == 50.0\n'
          if 'def test_supply_demand_uses_explicit_score_when_available' not in text:
              addition = '''\n\ndef test_supply_demand_uses_explicit_score_when_available():\n    class ExplicitSupplyDemandAnalysis(SignedAnalysis):\n        supply_demand_score = -20\n\n    engine = ConfidenceEngine()\n    scores = engine._collect_engines(ExplicitSupplyDemandAnalysis())\n\n    assert scores["supply_demand"] == 40.0\n'''
              pos = text.find(marker)
              if pos == -1:
                  raise SystemExit('Expected regression assertion marker not found')
              end = pos + len(marker)
              text = text[:end] + addition + text[end:]
          test.write_text(text)
          PY

          git diff --check
          git diff -- analysis/confidence_engine.py tests/test_confidence_score_contract.py
          git config user.name 'siasoltoon'
          git config user.email 'siyavashjahangiri105@gmail.com'
          git add analysis/confidence_engine.py tests/test_confidence_score_contract.py
          git diff --cached --quiet && { echo 'No changes to commit'; exit 0; }
          git commit -m 'fix: prevent confidence supply-demand score aliasing'
          git push origin main
