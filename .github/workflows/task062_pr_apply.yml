name: TASK-062 PR apply

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply focused fix
        shell: python
        run: |
          from pathlib import Path
          confidence = Path("analysis/confidence_engine.py")
          text = confidence.read_text()
          old = '''            "supply_demand": self.normalize_signed_score(\n                self._get(\n                    analysis,\n                    "trend_score",\n                    0.0,\n                )\n            ),'''
          new = '''            "supply_demand": self.normalize_signed_score(\n                self._get(\n                    analysis,\n                    "supply_demand_score",\n                    0.0,\n                )\n            ),'''
          if old not in text:
              raise SystemExit("Expected TASK-062 mapping not found")
          confidence.write_text(text.replace(old, new, 1))

          test = Path("tests/test_confidence_score_contract.py")
          text = test.read_text()
          old = '''    assert scores["price_action"] == 50.0\n    assert scores["supply_demand"] == 40.0\n'''
          new = '''    assert scores["price_action"] == 50.0\n    assert scores["supply_demand"] == 50.0\n\n\ndef test_supply_demand_uses_explicit_score_when_available():\n    class ExplicitSupplyDemandAnalysis(SignedAnalysis):\n        supply_demand_score = -20\n\n    engine = ConfidenceEngine()\n    scores = engine._collect_engines(ExplicitSupplyDemandAnalysis())\n    assert scores["supply_demand"] == 40.0\n'''
          if old not in text:
              raise SystemExit("Expected TASK-062 regression fixture not found")
          test.write_text(text.replace(old, new, 1))

      - name: Focused regression
        run: python -m pytest -q tests/test_confidence_score_contract.py tests/test_confidence_engine.py

      - name: Commit fix to PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/confidence_engine.py tests/test_confidence_score_contract.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: prevent confidence supply-demand score aliasing"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
