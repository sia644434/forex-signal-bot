name: TASK-062 cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor == 'siasoltoon'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary workflows
        run: |
          rm -f .github/workflows/task062_apply.yml .github/workflows/task062_cleanup.yml
          git config user.name 'siasoltoon'
          git config user.email 'siyavashjahangiri105@gmail.com'
          git add -A .github/workflows/task062_apply.yml .github/workflows/task062_cleanup.yml
          git commit -m 'chore: remove temporary TASK-062 workflows'
          git push origin main
