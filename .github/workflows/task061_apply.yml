name: TASK-061 apply

on:
  push:
    paths:
      - .github/workflows/task061_apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply minimal TASK-061 fix
        shell: python
        run: |
          from pathlib import Path

          path = Path("analysis/confidence_engine.py")
          text = path.read_text()

          marker = "    # ==================================================\n    # Normalize Confidence\n"
          helper = '''    # ==================================================\n    # Normalize Signed Analysis Score\n    # ==================================================\n\n    @staticmethod\n    def normalize_signed_score(\n        score: float | None,\n    ) -> float:\n        """Convert signed analysis scores (-100..100) to 0..100."""\n\n        if score is None:\n            return 50.0\n\n        try:\n            value = float(score)\n        except (TypeError, ValueError):\n            return 50.0\n\n        value = max(-100.0, min(100.0, value))\n        return ((value + 100.0) / 200.0) * 100.0\n\n'''
          if "def normalize_signed_score(" not in text:
              text = text.replace(marker, helper + marker, 1)

          start = text.index("    # ==================================================\n    # Collect Engine Scores\n")
          end = text.index("    # ==================================================\n    # Calculate Weighted Votes\n", start)
          section = text[start:end].replace("self.normalize(\n", "self.normalize_signed_score(\n")
          text = text[:start] + section + text[end:]

          start = text.index("    # ==================================================\n    # Market Uncertainty\n")
          end = text.index("    # ==================================================\n    # Build Warnings\n", start)
          section = text[start:end]

          old = '''        volatility_score = self.normalize(\n            self._get(\n                analysis,\n                "volatility_score",\n                0.0,\n            )\n        )\n'''
          new = '''        volatility_score = self._get(\n            analysis,\n            "volatility_score",\n            0.0,\n        )\n\n        try:\n            volatility_score = float(volatility_score)\n        except (TypeError, ValueError):\n            volatility_score = 0.0\n\n        volatility_score = max(0.0, volatility_score)\n'''
          if old not in section:
              raise SystemExit("TASK-061 volatility block not found")
          section = section.replace(old, new, 1)
          section = section.replace("structure_score = self.normalize(\n", "structure_score = self.normalize_signed_score(\n", 1)
          section = section.replace("momentum_score = self.normalize(\n", "momentum_score = self.normalize_signed_score(\n", 1)
          text = text[:start] + section + text[end:]

          path.write_text(text)

          test = Path("tests/test_confidence_score_contract.py")
          test.write_text('''from analysis.confidence_engine import ConfidenceEngine\n\n\nclass SignedAnalysis:\n    smart_money_score = 20\n    structure_score = -20\n    price_action_score = 0\n    momentum_score = 20\n    trend_score = -20\n    candlestick_score = 0\n    elliott_score = 20\n    harmonic_score = -20\n    brooks_score = 0\n    wyckoff_score = 20\n    volatility_score = 2.5\n\n\ndef test_signed_score_normalization_matches_decision_contract():\n    engine = ConfidenceEngine()\n    assert engine.normalize_signed_score(-20) == 40.0\n    assert engine.normalize_signed_score(0) == 50.0\n    assert engine.normalize_signed_score(20) == 60.0\n\n\ndef test_signed_component_votes_preserve_direction():\n    engine = ConfidenceEngine()\n    assert engine.direction(engine.normalize_signed_score(-20)) == "bearish"\n    assert engine.direction(engine.normalize_signed_score(0)) == "neutral"\n    assert engine.direction(engine.normalize_signed_score(20)) == "bullish"\n\n\ndef test_collect_engines_uses_signed_component_contract():\n    engine = ConfidenceEngine()\n    scores = engine._collect_engines(SignedAnalysis())\n    assert scores["smart_money"] == 60.0\n    assert scores["structure"] == 40.0\n    assert scores["price_action"] == 50.0\n    assert scores["supply_demand"] == 40.0\n\n\ndef test_volatility_remains_ratio_contract():\n    engine = ConfidenceEngine()\n    assert engine._calculate_market_uncertainty(SignedAnalysis()) >= 0.15\n''')

          workflow = Path(".github/workflows/task061_apply.yml")
          workflow.unlink()

      - name: Commit TASK-061 fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/confidence_engine.py tests/test_confidence_score_contract.py .github/workflows/task061_apply.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: align confidence with signed analysis score contract"
          git push origin HEAD:main
