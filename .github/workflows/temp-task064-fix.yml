name: temp-task064-fix
on:
  push:
    paths:
      - '.github/workflows/temp-task064-fix.yml'

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Repair supply-demand decision contract
        shell: python
        run: |
          from pathlib import Path
          p = Path('analysis/decision_engine.py')
          s = p.read_text()
          old = '''        score = self._read_component(\n            analysis,\n            "trend_score",\n        )\n\n        supply_demand = getattr(\n'''
          new = '''        score = self._read_component(\n            analysis,\n            "supply_demand_score",\n        )\n\n        supply_demand = getattr(\n'''
          if old not in s:
              raise SystemExit('expected DecisionEngine supply-demand block not found')
          p.write_text(s.replace(old, new, 1))

          t = Path('tests/test_decision_engine.py')
          ts = t.read_text()
          addition = '''\n\nclass SupplyDemandAnalysis(MockAnalysis):\n    supply_demand_score = -100\n    trend_score = 60\n\n\nclass BullishSupplyDemandAnalysis(SupplyDemandAnalysis):\n    supply_demand_score = 100\n\n\ndef test_supply_demand_uses_explicit_score_not_trend_score():\n    engine = DecisionEngine()\n\n    bearish = engine.decide(SupplyDemandAnalysis())\n    bullish = engine.decide(BullishSupplyDemandAnalysis())\n\n    assert bullish.score > bearish.score\n\n\n'''
          if 'test_supply_demand_uses_explicit_score_not_trend_score' not in ts:
              t.write_text(ts + addition)

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/decision_engine.py tests/test_decision_engine.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix: wire decision engine to supply-demand score'
          git push
