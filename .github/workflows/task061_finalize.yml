name: TASK-061 finalize

on:
  push:
    paths:
      - .github/workflows/task061_finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix signed-score neutral defaults
        shell: python
        run: |
          from pathlib import Path

          path = Path('analysis/confidence_engine.py')
          text = path.read_text()
          start = text.index('    # ==================================================\n    # Collect Engine Scores\n')
          end = text.index('    # ==================================================\n    # Calculate Weighted Votes\n', start)
          section = text[start:end]
          section = section.replace('                    50.0,\n', '                    0.0,\n')
          text = text[:start] + section + text[end:]
          path.write_text(text)

      - name: Run focused regression tests
        run: |
          python -m compileall -q analysis/confidence_engine.py
          pytest -q tests/test_confidence_score_contract.py

      - name: Commit and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/confidence_engine.py .github/workflows/task061_finalize.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: preserve neutral defaults for signed confidence scores"
          git push origin HEAD:main
